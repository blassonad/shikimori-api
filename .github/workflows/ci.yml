name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with Rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --check

      - name: Build Rustdoc
        run: cargo doc --no-deps --all-features

      - name: Run Rustdoc examples
        run: cargo test --doc --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Run Clippy without warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (Rust 1.75)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0

      - name: Verify declared MSRV
        run: cargo check --all-targets --locked

  package:
    name: Package verification
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate publishable package without uploading
        run: cargo publish --dry-run --locked
