name: Publish to crates.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release eligibility
    if: github.repository == 'blassonad/shikimori-api'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      already_published: ${{ steps.package.outputs.already_published }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read package version and query crates.io
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          status="$(curl --silent --show-error --header 'User-Agent: shikimori-api-release-workflow/0.1 (github-actions)' --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/shikimori-api/${version}")"
          case "$status" in
            200) already_published=true ;;
            404) already_published=false ;;
            *) echo "Unexpected crates.io HTTP status: $status" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "already_published=$already_published" >> "$GITHUB_OUTPUT"
          echo "Release candidate: shikimori-api $version; already published: $already_published"

  publish:
    name: Publish ${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust with Rustfmt and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check crates.io registry configuration
        id: registry
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_PUBLISH_ENABLED: ${{ vars.CRATES_IO_PUBLISH_ENABLED }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ] && [ "$CRATES_IO_PUBLISH_ENABLED" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Publication is skipped until the crates-io Environment has CARGO_REGISTRY_TOKEN and CRATES_IO_PUBLISH_ENABLED=true."
          fi

      - name: Verify release candidate
        if: steps.registry.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo doc --no-deps --all-features
          cargo test --doc --all-features
          cargo test --all-targets --all-features --locked
          cargo clippy --all-targets --all-features -- -D warnings
          cargo publish --dry-run --locked

      - name: Publish immutable crate version
        if: steps.registry.outputs.configured == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Explain configuration skip
        if: steps.registry.outputs.configured != 'true'
        run: echo "Configure CARGO_REGISTRY_TOKEN and CRATES_IO_PUBLISH_ENABLED=true in the crates-io GitHub Environment to enable automatic publishing."

  no-release-needed:
    name: Existing version; no release needed
    needs: prepare
    if: needs.prepare.outputs.already_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "shikimori-api ${{ needs.prepare.outputs.version }} already exists on crates.io; skipping publication."
